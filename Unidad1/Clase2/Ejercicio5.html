<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejecicio 5 cambio de contenido con texto</title>
</head>
<body>
    <div id="elemento1">Texto</div>
    <script>
        const elemento1 = document.getElementById('elemento1');
        elemento1.textContent = 'nuevo texto';
        elemento1.style.color = 'red'; // Cambia el color de la letra a rojo
    </script>
</body>
</html>
