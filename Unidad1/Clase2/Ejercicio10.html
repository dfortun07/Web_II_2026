<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 10 : USO DE APPENDCHILD</title>
</head>
<body>
    <div id="contenedor">contenedor inicial</div>
    <button id="btn">Agregar elemento</button>
    <script>
        const nuevo_elemento = document.createElement('div')
        nuevo_elemento.textContent = 'elemento creado con dom'
        const contenedor = document.getElementById('contenedor')
        contenedor.appendChild(nuevo_elemento)
        console.log(contenedor)
    </script>
</body>
</html>
