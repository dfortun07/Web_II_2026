<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJECICIO 4: QUERYSELECTORALL</title>
</head>
<body>
    <P> NOMBRE1 </P>
    <P> NOMBRE2 </P>
    <P> NOMBRE3 </P>
    <script>
        const elementos = document.querySelectorAll('p');
        elementos.forEach(elemento => {
            elemento.style.display = 'none'
        });
    </script>
</body>
</html>
