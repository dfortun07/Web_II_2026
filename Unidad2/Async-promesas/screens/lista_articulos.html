<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Listado de Artículos</title>
    <link rel="icon" href="../assets/img/doguitoadm.svg" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/base/base.css" />
    <link rel="stylesheet" href="../assets/css/componentes/header.css" />
    <link rel="stylesheet" href="../assets/css/lista_cliente.css" />
    <link rel="stylesheet" href="../assets/css/componentes/table.css" />
    <link rel="stylesheet" href="../assets/css/componentes/button.css" />
  </head>
  <body>
    <header class="header container">
      <img src="../assets/img/doguitoadm.svg" alt="Logotipo Admin" class="header__logo" />
      <nav>
        <ul class="header__list-nav">
          <li class="header__link"><a href="#">Dashboard</a></li>
          <li class="header__link"><a href="lista_articulos.html">Artículos</a></li>
          <li class="header__link"><a href="lista_usuarios.html">Usuarios</a></li>
          <li class="header__link"><a href="lista_mascotas.html">Mascotas</a></li>
        </ul>
      </nav>
    </header>

    <main class="clientes-container">
      <table class="table">
        <thead>
          <tr>
            <th class="table__column--p">Nombre</th>
            <th class="table__column--p">Precio</th>
            <th class="table__column--g">Descripción</th>
            <th class="table__column--m table__align--right">
              <a href="./registrar_articulo.html" class="simple-button simple-button--add">Nuevo Artículo</a>
            </th>
          </tr>
        </thead>
        <tbody data-table></tbody>
      </table>
    </main>
    <script type="module" src="../controllers/articulo_controller.js"></script>
  </body>
</html>
